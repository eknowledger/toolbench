# Publish the project site, site/, on GitHub Pages at https://eknowledger.github.io/toolbench/.
#
# The build is told the project Pages prefix (`SITE_BASE`) so its assets resolve under it. The bench in
# bench/ is not published: it is the browser suite's fixture, and the site's gallery shows everything it
# did, with the code beside it.
#
# Enabling Pages itself is a maintainer click: Settings → Pages → Source →
# GitHub Actions. Until that is set, the deploy job fails and the URL 404s.
#
# Pull requests build with the Pages prefix (so a missing prefix fails here) and run the site's checks,
# but do not deploy. A fork PR must not publish the upstream site.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deploy that has already started writing the live site.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: site for Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the packages
        # ⚠️ Before the site, and not for completeness. It imports the packages through their names,
        # which resolve to packages/*/dist, and this repository does not keep dist in git. Without this
        # step the build fails with "Failed to resolve entry for package", which names the package and
        # not the missing build.
        run: pnpm build

      - name: Build the site for the Pages root
        # No browser: the docs' diagrams are read from site/build/diagrams/, drawn by `pnpm site:diagrams`
        # and committed. A diagram edited without redrawing fails this step and names that command.
        env:
          SITE_BASE: /toolbench/
        run: pnpm site:build

      - name: Confirm the prefix landed in the markup
        # An allowlist: the built index must request assets under the prefix, and in-page navigation must
        # stay relative so the prefix is not required twice.
        run: |
          grep -F '/toolbench/assets/' site/dist/index.html
          grep -F 'href="./gallery.html"' site/dist/index.html
          grep -F 'href="./docs.html"' site/dist/index.html

      - name: Check the site's links, its figures, and that every example runs
        # The link and figure checks read the built HTML; the rest open the pages in Chromium.
        env:
          SITE_BASE: /toolbench/
          CHROME_CHANNEL: chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        if: github.ref == 'refs/heads/main'

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/dist

  deploy:
    name: publish to Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
