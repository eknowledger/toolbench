# Publish the project site on GitHub Pages, with the bench beside it as the playground.
#
# Two builds, one artifact:
#   https://eknowledger.github.io/toolbench/             site/, the project site
#   https://eknowledger.github.io/toolbench/playground/  bench/, the test bench, unchanged
#
# Each build is told its own prefix (`SITE_BASE`, `BENCH_BASE`) so its assets resolve under the
# project Pages path, then the bench's output is copied under the site's as `playground/`.
#
# Enabling Pages itself is a maintainer click: Settings → Pages → Source →
# GitHub Actions. Until that is set, the deploy job fails and the URL 404s.
#
# Pull requests build with the Pages prefixes (so a missing prefix fails here) and run the site's
# checks, but do not deploy. A fork PR must not publish the upstream site.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deploy that has already started writing the live site.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: site and playground for Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the packages
        # ⚠️ Before the bench and the site, and not for completeness. Both import the packages through
        # their names, which resolve to packages/*/dist, and this repository does not keep dist in git.
        # Without this step the bench's config fails to load with "Failed to resolve entry for package
        # @toolbench/sdk", which names the package and not the missing build.
        run: pnpm build

      - name: Build the site for the Pages root
        env:
          SITE_BASE: /toolbench/
        run: pnpm site:build

      - name: Build the bench for the playground path
        # Local `pnpm bench:build` keeps base `/` so :4173 and the browser suite stay put. This job is
        # the one that would 404 without the prefix.
        env:
          BENCH_BASE: /toolbench/playground/
        run: pnpm bench:build

      - name: Confirm each prefix landed in its markup
        # An allowlist: each built index must request assets under its own prefix, and in-page
        # navigation must stay relative so the prefix is not required twice.
        run: |
          grep -F '/toolbench/playground/assets/' bench/dist/index.html
          grep -F 'href="./tool.html' bench/dist/index.html
          grep -F 'href="./failure.html' bench/dist/index.html
          test -f bench/dist/failure.html
          test -f bench/dist/tool.html
          test -f bench/dist/article.html
          grep -F '/toolbench/assets/' site/dist/index.html
          grep -F 'href="./gallery.html"' site/dist/index.html
          grep -F 'href="./playground/"' site/dist/index.html

      - name: Put the bench under the site as the playground
        run: |
          rm -rf _site
          cp -R site/dist _site
          cp -R bench/dist _site/playground
          test -f _site/index.html
          test -f _site/playground/index.html

      - name: Check the site's links, and that every gallery tool runs
        # The link check reads the built HTML; the gallery check opens each tool in Chromium. With
        # SITE_PLAYGROUND set, the playground link is checked against the assembled artifact too.
        env:
          SITE_BASE: /toolbench/
          SITE_PLAYGROUND: ${{ github.workspace }}/_site/playground
          CHROME_CHANNEL: chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        if: github.ref == 'refs/heads/main'

      - name: Upload the site and the playground
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: publish to Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
