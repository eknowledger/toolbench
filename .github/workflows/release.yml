# Publish to npm, with two gates and a human at both.
#
# 1. Someone merges a PR to main that contains a changeset. The `version` job opens (or updates) a
#    "Release: version packages" PR: version numbers bumped, changelogs written.
# 2. Someone merges THAT PR. There are now no pending changesets, so the `publish` job runs, waits for
#    a manual approval on the npm-publish environment, and publishes.
#
# Merging the release PR is where you approve the version numbers and the changelog. The environment
# approval is the last stop before something is on npm, and npm has no undo.
#
# ⚠️ The jobs are split because `environment:` is job-level, not step-level. One combined job would
# make every push to main wait for an approval, including the versioning runs that publish nothing,
# and an approval prompt that fires constantly is an approval prompt nobody reads.
#
# Setup this needs once, see docs/releasing.md:
#   - an npm org named `toolbench`, created at npmjs.com/org/create (no CLI for this)
#   - a trusted publisher on npm for each package, naming this repo, this workflow, and the
#     npm-publish environment
#   - a repository variable PUBLISH_TO_NPM set to "true"
name: release

on:
  push:
    branches: [main]

concurrency:
  # Never two releases at once: the second would publish a half-updated set of versions.
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Is there anything waiting to be released? ────────────────────────────────────────────────────
  pending:
    name: check for pending changesets
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
      unpublished: ${{ steps.registry.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: check
        # .changeset/ always holds README.md and config.json. Any OTHER markdown file is a pending
        # release note, which means we version rather than publish.
        run: |
          if [ -n "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Pending changesets found: will open or update a release PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets: a publish may be due." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: registry
        # ⚠️ Without this, every push to main with no pending changesets parks a deployment waiting for
        # a human, even when every version is already on npm and there is nothing to do. An approval
        # prompt that fires constantly is one nobody reads, which defeats the gate.
        #
        # So ask the registry. If any package's local version is not published, a release is genuinely
        # due; otherwise the publish job is skipped entirely and nobody is interrupted.
        run: |
          unpublished=false
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            private=$(node -p "require('./${dir}package.json').private === true")
            [ "$private" = "true" ] && continue
            local_v=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$local_v" version >/dev/null 2>&1; then
              echo "$name@$local_v is already on npm"
            else
              echo "$name@$local_v is NOT on npm: a publish is due"
              unpublished=true
            fi
          done
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"

  # ── Pending changesets: bump versions and write changelogs, in a PR ──────────────────────────────
  version:
    name: open the release PR
    needs: pending
    if: needs.pending.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump
      pull-requests: write # open and update the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # changesets needs history to work out what changed
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v2.1.2
        with:
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "Release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Nothing pending: publish, after a human says so ──────────────────────────────────────────────
  publish:
    name: publish to npm
    needs: pending
    if: needs.pending.outputs.has_changesets == 'false' && needs.pending.outputs.unpublished == 'true' && vars.PUBLISH_TO_NPM == 'true'
    runs-on: ubuntu-latest
    # Requires a manual approval before any step runs. This is the last gate before npm.
    environment: npm-publish
    permissions:
      contents: write # create the git tag and the GitHub release
      id-token: write # npm provenance: proves on npm that this build came from this commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org # writes the .npmrc auth line for us
      - run: pnpm install --frozen-lockfile

      - name: Verify before publishing
        # Deliberately duplicates tests.yml and build.yml rather than trusting that they ran. This is
        # the last gate before something is public and unrepealable.
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v2.1.2
        with:
          # `pnpm release` builds first, then publishes. Building inside the release script rather
          # than relying on the step above means a manual `pnpm release` cannot publish stale dist.
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm credential. Both packages have a trusted publisher pinned to this repository, this
          # workflow, and the npm-publish environment, so authentication is the OIDC token minted by
          # `id-token: write` below. That is also the only path that works here: the account requires
          # 2FA for writes, and a passkey cannot answer npm's CLI one-time-password prompt.
          NPM_CONFIG_PROVENANCE: "true"

      - name: Say what happened
        if: always()
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          {
            if [ "$PUBLISHED" = "true" ]; then
              echo "### Published"
              echo
              echo '```json'
              echo "$PACKAGES"
              echo '```'
            else
              echo "### Nothing to publish"
              echo
              echo "Every package version in this commit is already on npm."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
