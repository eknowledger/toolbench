# The slow half: real builds, real browsers, real transfer sizes.
#
# Separate from tests.yml so it gets its own badge and runs in parallel. It answers a different
# question: not "is the logic right" but "does what we ship actually work and stay small".
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build and measure once. Three engines running three identical builds proved nothing three times,
  # and the transfer budget in particular is a property of the bundle rather than of the browser
  # reading it, so measuring it per engine invites three answers to a one-answer question.
  build:
    name: build and measure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # the site build below dates each release on its What's new page from git history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Read the installed Playwright version
        # The browser jobs below run in the Playwright image for exactly this version. Read from what the
        # lockfile installed rather than written into the image tag, so a Playwright bump moves the image
        # with it: an image one version behind holds browser builds the library does not look for. The
        # pattern check keeps anything but a plain version out of the image reference.
        id: playwright
        run: |
          version=$(node -p 'require("playwright/package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected Playwright version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: pnpm build

      - name: Check the published package contents
        # What actually lands in the tarball. `files: ["dist"]` plus the README and LICENSE npm adds
        # for us; anything else in here means a stray file is about to be published, and unpublishing
        # is not really a thing.
        run: |
          pnpm --filter @toolbench/sdk exec npm pack --dry-run
          pnpm --filter @toolbench/runtime exec npm pack --dry-run

      - name: Build the bench
        run: pnpm bench:build

      - name: Build the project site
        # Only so the size check below can measure the site's landing page. It fails under CI when this
        # build is missing, so removing this step cannot quietly turn that line off.
        run: pnpm site:build

      - name: Transfer size budget
        # The sizes quoted in README.md and docs/architecture.md, checked. A number in a document
        # rots the moment nobody checks it, and the lazy-loading argument rests on these staying
        # small. Also catches a chunk vanishing or stopping being split.
        run: node scripts/size-check.mjs

      - name: Keep what was built
        # Useful on a failure: download it and open the exact build the browser tests ran against,
        # rather than trying to reproduce the state locally. Also what the browser jobs below consume,
        # so every engine reads the same bytes rather than its own rebuild.
        #
        # ⚠️ The packages' dist is in here too, and not for symmetry. `pnpm test:bench` starts
        # `vite preview`, which loads `bench/vite.config.ts`, whose seed plugin imports
        # `@toolbench/sdk`, which resolves to `packages/sdk/dist`. Shipping only `bench/dist` gave three
        # engine legs failing with "vite preview did not start", which names the symptom and not the
        # cause. A built bench is not self-sufficient: serving it needs the workspace built too.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: built
          path: |
            bench/dist
            packages/sdk/dist
            packages/runtime/dist
          retention-days: 7
          if-no-files-found: error

  # One job per engine, reading the build above. fail-fast is off because "Firefox is broken" and
  # "WebKit is broken" are different findings and cancelling the second to report the first hides one.
  browser:
    name: browser (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    # About twice the slowest measured job in the container, so a hang is cut off rather than waited out.
    # Chromium is longer because it also runs `test:counts` below. Measured on the two runs of #276's PR:
    # chromium 360 and 514 s, firefox 311 and 268 s, webkit 346 and 336 s.
    timeout-minutes: ${{ matrix.browser == 'chromium' && 17 || 12 }}
    # ⚠️ In the Playwright image, not on the bare runner, because `playwright install --with-deps` fetched
    # its system packages from the runner's Ubuntu mirror, and in about one job in nine that mirror ran at
    # 53 to 234 kB/s: 4 to 18 minutes for 26 to 117 MB, and twice a WebKit job cancelled at the timeout
    # before its tests finished (#276). The image has the packages and all three browsers already, so
    # there is no apt step and no browser download left to be slow.
    #
    # The tag comes from the build job, which reads it from the installed Playwright, so it cannot fall
    # behind a Playwright bump. `--user 1001` is the runner's own user, so the workspace and HOME mounted
    # from the host belong to whoever runs the browsers; it is what Playwright's CI docs give for this
    # image. `--ipc=host` is their recommendation for Chromium, which can run out of shared memory without.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Take what was built and measured
        # Into the repository root, because the artifact holds bench/dist and both packages' dist and
        # its paths are relative to that root.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: built
          path: .

      - name: Check the image holds this Playwright's browser
        # A no-op that finishes in about a second, because the image already holds this version's browsers
        # in PLAYWRIGHT_BROWSERS_PATH. Kept as its own step so that stays visible: if it ever takes minutes,
        # the image and the library have stopped matching and it is downloading. No --with-deps, which
        # would need root and would go back to the apt mirror this container exists to avoid.
        run: pnpm exec playwright install "${{ matrix.browser }}"

      - name: The runtime, in a real browser
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          # Bundled Chromium, not a system Chrome the runner does not have.
          CHROME_CHANNEL: chromium
        run: pnpm test:bench

      - name: Check documented test counts
        # The Count column in docs/architecture.md §12 is checked here rather than trusted. Before 0.7.0
        # three of its cells were wrong at once because the script only ran when someone remembered it.
        #
        # One leg is enough: the browser suite registers the same tests on every engine, so the count is
        # a property of the suite and three legs would give one answer three times. It sits in a browser
        # leg, not in tests.yml, because the script measures the browser layer by running it and that
        # needs the built bench downloaded above.
        #
        # ⚠️ This runs the Chromium suite a second time (the script counts by running, it does not read
        # the previous step's output) and the whole Node suite twice more: 44 s on a laptop. This leg
        # finished 40 s before Firefox on the last main run, so wall clock moves little. Folding it into
        # the step above would save that time but bury the browser suite's own output, which the script
        # captures and only prints the tail of on failure.
        if: matrix.browser == 'chromium'
        env:
          PLAYWRIGHT_BROWSER: chromium
          CHROME_CHANNEL: chromium
        run: pnpm test:counts

  # ⚠️ This job exists for branch protection, and its name must not change.
  #
  # `main` requires a status check called "packages, bench, browser". GitHub appends matrix values to a
  # job's name, so making the browser job a matrix would have reported "packages, bench, browser
  # (chromium)" and friends, the required context would never have appeared again, and every merge would
  # have blocked indefinitely. Keeping one unmatrixed job that waits on the others means the required
  # context keeps existing, adding a fourth engine needs no change to repository settings, and there is
  # no window where main is unmergeable.
  required:
    name: packages, bench, browser
    needs: [build, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless the build and every engine passed
        # `needs` alone does not do this: with `if: always()` this job runs even when a dependency
        # failed, so the result has to be asserted rather than assumed.
        run: |
          echo "build:   ${{ needs.build.result }}"
          echo "browser: ${{ needs.browser.result }}"
          test "${{ needs.build.result }}" = "success" || exit 1
          test "${{ needs.browser.result }}" = "success" || exit 1
