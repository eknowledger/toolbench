# Fast feedback: types and every Node-runnable test. Under a minute.
#
# Split from build.yml so the two get their own status badges and run in parallel. This is the one
# that should fail first when something is wrong, because it is the one people wait for.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both ends of the range package.json claims, `>=24`: the floor, and the newest release. One version
  # inside a range is one point, not a range. A loader hook deprecated in Node 26 once printed a warning
  # that failed a test asserting empty stderr, while CI on 24 stayed green; it was caught only because a
  # reviewer's machine ran 26. When the engines field moves, move the `floor: true` entry with it; when
  # a new Node major ships, add it as a leg.
  #
  # The floor leg also carries the two report-only steps below, which need running once, not per
  # version.
  test:
    name: types and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Off for the same reason as the browser matrix: "fails on 26" and "fails on 24" are different
      # findings, and cancelling one leg to report the other hides which.
      fail-fast: false
      matrix:
        include:
          - node: 24
            floor: true
          - node: 26
            floor: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # 24 is the floor because it runs TypeScript directly, which is how tool fixtures execute
          # with no build step.
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests and every tool's fixtures
        # ⚠️ This is the load-bearing compatibility check: EVERY tool's fixtures run against the
        # current SDK and runtime. If a change breaks a tool written against an older contract
        # version, it fails here, which is what makes backward compatibility a tested claim rather
        # than an intention. See docs/versioning.md.
        run: pnpm test

      - name: Graph layout at 250 and 500 nodes
        # Out of `pnpm test` because these graphs took it from under a second to 25 (#152), and run here on
        # every pull request because overlaps at these sizes are what the layout once got wrong. Floor leg only:
        # the layout has no Node-version dependence a second run would find, and it is the slowest step. A
        # failure fails this job, so the required "types and unit tests" context reports it.
        if: matrix.floor
        run: pnpm test:graph-scale

      - name: Node coverage (report only, no threshold)
        # Same suite as the step above, with V8 coverage. ⚠️ Do not add --test-coverage-lines,
        # --test-coverage-branches, or --test-coverage-functions: those flags fail the job on a
        # percentage, which produces tests written to satisfy the percentage. The useful output is
        # the uncovered list, written to the job summary. This is the Node suite only. Browser
        # coverage from pnpm test:bench is not in these numbers.
        #
        # ⚠️ Advisory, like the changeset check below, and for a sharper reason: this job is a required
        # check, so a report that can exit non-zero can block every merge. The script fails if Node ever
        # stops emitting the coverage event in the shape it expects, which is a change in Node rather than
        # a problem with the code under review. A report must not be able to hold the door shut.
        #
        # Floor leg only: it is a report, and two legs would write two copies into the job summary.
        if: matrix.floor
        continue-on-error: true
        run: pnpm coverage

      - name: Changeset present for a package change
        # A change under packages/ that a consumer would notice needs a release note. Advisory on
        # purpose: plenty of package changes (comments, tests, internal renames) genuinely need no
        # changeset, and a hard failure would just teach people to write empty ones.
        # Floor leg only, so the warning appears once rather than once per Node version.
        if: github.event_name == 'pull_request' && matrix.floor
        continue-on-error: true
        # Refs go through env rather than being interpolated into the script. They are repo-controlled
        # here, but a workflow that interpolates a ref straight into a shell is one edit away from
        # being injectable, and the habit is cheaper than the audit.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          if echo "$changed" | grep -q '^packages/'; then
            if ! echo "$changed" | grep -qE '^\.changeset/.*\.md$'; then
              echo "::warning::This PR touches packages/ but adds no changeset. If a consumer would notice the change, run 'pnpm changeset'. If not, ignore this."
            fi
          fi

  # ⚠️ This job exists for branch protection, and its name must not change.
  #
  # `main` requires a status check called "types and unit tests". Matrixing the job above made GitHub
  # report it as "types and unit tests (node 24)" and "(node 26)", so without this job the required
  # context would never appear again and every merge would block. Same shape as `required` in
  # build.yml: one unmatrixed job that waits on the legs and asserts their result, so adding a Node
  # version needs no change to repository settings.
  required:
    name: types and unit tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Node version passed
        # `needs` alone does not do this: with `if: always()` this job runs even when a leg failed or
        # was cancelled, so the result has to be asserted rather than assumed.
        run: |
          echo "test: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success" || exit 1
