# Fast feedback: types and every Node-runnable test. Under a minute.
#
# Split from build.yml so the two get their own status badges and run in parallel. This is the one
# that should fail first when something is wrong, because it is the one people wait for.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          # 24 runs TypeScript directly, which is how tool fixtures execute with no build step.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests and every tool's fixtures
        # ⚠️ This is the load-bearing compatibility check: EVERY tool's fixtures run against the
        # current SDK and runtime. If a change breaks a tool written against an older contract
        # version, it fails here, which is what makes backward compatibility a tested claim rather
        # than an intention. See docs/versioning.md.
        run: pnpm test

      - name: Node coverage (report only, no threshold)
        # Same suite as the step above, with V8 coverage. ⚠️ Do not add --test-coverage-lines,
        # --test-coverage-branches, or --test-coverage-functions: those flags fail the job on a
        # percentage, which produces tests written to satisfy the percentage. The useful output is
        # the uncovered list, written to the job summary. This is the Node suite only. Browser
        # coverage from pnpm test:bench is not in these numbers.
        #
        # ⚠️ Advisory, like the changeset check below, and for a sharper reason: this job is a required
        # check, so a report that can exit non-zero can block every merge. The script fails if Node ever
        # stops emitting the coverage event in the shape it expects, which is a change in Node rather than
        # a problem with the code under review. A report must not be able to hold the door shut.
        continue-on-error: true
        run: pnpm coverage

      - name: Changeset present for a package change
        # A change under packages/ that a consumer would notice needs a release note. Advisory on
        # purpose: plenty of package changes (comments, tests, internal renames) genuinely need no
        # changeset, and a hard failure would just teach people to write empty ones.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # Refs go through env rather than being interpolated into the script. They are repo-controlled
        # here, but a workflow that interpolates a ref straight into a shell is one edit away from
        # being injectable, and the habit is cheaper than the audit.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          if echo "$changed" | grep -q '^packages/'; then
            if ! echo "$changed" | grep -qE '^\.changeset/.*\.md$'; then
              echo "::warning::This PR touches packages/ but adds no changeset. If a consumer would notice the change, run 'pnpm changeset'. If not, ignore this."
            fi
          fi
